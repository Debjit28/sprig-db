{{define "login.html"}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sprig-DB — Login</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="login-container">
    <div class="card login-card" id="main-card">
      <div class="login-header">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom:16px; color:var(--text-main);">
          <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
          <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path>
          <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path>
        </svg>
        <h1>Sprig-DB</h1>
        <p>Authentication Required</p>
      </div>

      <div id="auth-success" style="display:none; margin-bottom:16px; padding:12px; border:1px solid var(--success); background:var(--success-bg); color:var(--success); border-radius:var(--radius); font-size:13px; text-align:center;"></div>
      <div id="auth-error" style="display:none; margin-bottom:16px; padding:12px; border:1px solid var(--danger); background:var(--danger-bg); color:var(--danger); border-radius:var(--radius); font-size:13px; text-align:center;"></div>

      <!-- LoginForm -->
      <div id="login-form-container">
        <form id="login-form" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label class="form-label" for="username">Username</label>
            <input class="form-input" type="text" id="username" name="username" required autocomplete="username" placeholder="Username">
          </div>
          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input class="form-input" type="password" id="password" name="password" required autocomplete="current-password" placeholder="Password">
          </div>
          <div style="display:flex; justify-content:flex-end; margin-bottom:16px;">
            <a href="#" onclick="showSection('forgot-form-container')" style="font-size: 13px; color: var(--text-muted); text-decoration: underline;">Reset password</a>
          </div>
          <button class="btn btn-primary" type="submit" style="width:100%;">
            Sign In
          </button>
        </form>

        <div class="login-toggle">
          <a href="#" onclick="showSection('register-form-container'); loadCaptcha();">Create an account</a>
        </div>
      </div>

      <!-- Register Form -->
      <div id="register-form-container" style="display:none;">
        <form onsubmit="handleRegister(event)">
          <div class="form-group">
            <label class="form-label" for="reg-username">Username</label>
            <input class="form-input" type="text" id="reg-username" required placeholder="Username">
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-password">Password</label>
            <input class="form-input" type="password" id="reg-password" required placeholder="Password">
          </div>
          
          <div class="form-group">
            <label class="form-label">Captcha Verification</label>
            <div style="display: flex; gap: 8px; align-items: stretch; margin-top: 4px;">
              <img id="captcha-image" alt="Captcha" style="height: 34px; border-radius: var(--radius); border: 1px solid var(--border-color); background: #FFF;" />
              <button type="button" class="btn btn-ghost" onclick="loadCaptcha()" style="height: 34px;" title="Refresh">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"></polyline><polyline points="23 20 23 14 17 14"></polyline><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path></svg>
              </button>
              <input type="hidden" id="reg-captcha-token">
              <input class="form-input" type="text" id="reg-captcha-answer" required placeholder="Code" style="flex:1; text-transform: uppercase;">
            </div>
          </div>

          <button class="btn btn-primary" type="submit" style="width:100%; margin-top:8px;">
            Register
          </button>
        </form>
        <div class="login-toggle">
          <a href="#" onclick="showSection('login-form-container')">Back to login</a>
        </div>
      </div>

      <!-- Forgot Password Form -->
      <div id="forgot-form-container" style="display:none;">
        <form onsubmit="handleForgot(event)">
          <div class="form-group">
            <label class="form-label" for="forgot-username">Username</label>
            <input class="form-input" type="text" id="forgot-username" required placeholder="Username">
          </div>
          <button class="btn btn-primary" type="submit" style="width:100%;">Request Reset</button>
        </form>
        <div class="login-toggle" style="display:flex; justify-content:space-between; margin-top:16px;">
          <a href="#" onclick="showSection('login-form-container')">Back</a>
          <a href="#" onclick="showSection('reset-form-container')">I have a token</a>
        </div>
      </div>

      <!-- Reset Password Form -->
      <div id="reset-form-container" style="display:none;">
        <form onsubmit="handleReset(event)">
          <div class="form-group">
            <label class="form-label" for="reset-token">Token</label>
            <input class="form-input" type="text" id="reset-token" required placeholder="Token">
          </div>
          <div class="form-group">
            <label class="form-label" for="reset-password">New Password</label>
            <input class="form-input" type="password" id="reset-password" required placeholder="New Password">
          </div>
          <button class="btn btn-primary" type="submit" style="width:100%;">Set Password</button>
        </form>
        <div class="login-toggle">
          <a href="#" onclick="showSection('login-form-container')">Back to login</a>
        </div>
      </div>

    </div>
  </div>

  <script>
    const sections = [
      'login-form-container', 'register-form-container', 
      'forgot-form-container', 'reset-form-container'
    ];

    function showSection(id) {
      sections.forEach(sec => {
        document.getElementById(sec).style.display = (sec === id) ? 'block' : 'none';
      });
      document.getElementById('auth-error').style.display = 'none';
      document.getElementById('auth-success').style.display = 'none';
    }

    function showError(msg) {
      const el = document.getElementById('auth-error');
      el.textContent = msg;
      el.style.display = 'block';
    }

    function showSuccess(msg) {
      const el = document.getElementById('auth-success');
      el.textContent = msg;
      el.style.display = 'block';
    }

    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      try {
        const res = await fetch('/auth/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          credentials: 'include',
          body: JSON.stringify({username, password})
        });
        const data = await res.json();
        if (!res.ok) { showError(data.error); return; }
        finishLogin(data.token, data.username, data.is_admin);
      } catch(err) { showError('Connection failed'); }
    }

    function finishLogin(token, username, isAdmin) {
      localStorage.setItem('sprig_token', token);
      localStorage.setItem('sprig_user', username);
      localStorage.setItem('sprig_is_admin', isAdmin);
      
      if (isAdmin) {
        window.location.href = '/dashboard';
      } else {
        window.location.href = '/user-portal';
      }
    }

    async function loadCaptcha() {
      try {
        const res = await fetch('/auth/captcha', { credentials: 'include' });
        const data = await res.json();
        document.getElementById('captcha-image').src = data.captcha_image;
        document.getElementById('reg-captcha-token').value = data.captcha_token;
        document.getElementById('reg-captcha-answer').value = '';
      } catch(err) { console.error('Failed to load captcha', err); }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const username = document.getElementById('reg-username').value;
      const password = document.getElementById('reg-password').value;
      const captcha_token = document.getElementById('reg-captcha-token').value;
      const captcha_answer = document.getElementById('reg-captcha-answer').value;
      try {
        const res = await fetch('/auth/register', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          credentials: 'include',
          body: JSON.stringify({username, password, captcha_token, captcha_answer})
        });
        const data = await res.json();
        if (!res.ok) { 
          showError(data.error); 
          loadCaptcha(); 
          return; 
        }
        
        showSection('login-form-container');
        showSuccess("Account created. Please log in.");
        document.getElementById('username').value = username;
        document.getElementById('password').value = ''; 
      } catch(err) { showError('Connection failed'); }
    }

    async function handleForgot(e) {
      e.preventDefault();
      const username = document.getElementById('forgot-username').value;
      try {
        const res = await fetch('/auth/forgot-password', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          credentials: 'include',
          body: JSON.stringify({username})
        });
        const data = await res.json();
        if (!res.ok) { showError(data.error); return; }
        
        showSection('reset-form-container');
        showSuccess("Token printed to server console.");
      } catch(err) { showError('Connection failed'); }
    }

    async function handleReset(e) {
      e.preventDefault();
      const reset_token = document.getElementById('reset-token').value;
      const password = document.getElementById('reset-password').value;
      try {
        const res = await fetch('/auth/reset-password', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          credentials: 'include',
          body: JSON.stringify({reset_token, password})
        });
        const data = await res.json();
        if (!res.ok) { showError(data.error); return; }
        
        showSection('login-form-container');
        showSuccess("Password reset. Please log in.");
      } catch(err) { showError('Connection failed'); }
    }
  </script>
</body>
</html>
{{end}}
