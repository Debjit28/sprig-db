{{define "user_portal.html"}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sprig-DB — User Portal</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="login-container">
    <div class="card login-card" style="max-width: 460px;">
      <div class="login-header">
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom:20px; color:var(--accent);">
          <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        <h1>Welcome, {{.Username}}!</h1>
        <p>User Portal Dashboard</p>
      </div>

      <div style="background: rgba(0,0,0,0.3); padding: 24px; border-radius: var(--radius-lg); margin-bottom: 32px; text-align: center; border: 1px solid var(--glass-border);">
        <h3 style="font-size:16px; margin-bottom:12px; font-family:var(--font-heading);">Standard Access</h3>
        <p style="color: var(--text-muted); font-size: 14px; line-height: 1.5;">
          This space is reserved for regular users. Administrators have access to the full data management dashboard and system settings.
        </p>
      </div>

      <div style="display: flex; gap: 16px;">
        <a class="btn btn-primary" style="flex: 1; padding: 12px;" href="/dashboard">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
          Manage Data
        </a>
        <button class="btn btn-ghost" style="flex: 1; padding: 12px;" onclick="logout()">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
          Log Out
        </button>
      </div>
    </div>
  </div>

  <script>
    function logout() {
      localStorage.removeItem('sprig_token');
      localStorage.removeItem('sprig_user');
      localStorage.removeItem('sprig_is_admin');
      document.cookie = "sprig_token=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
      window.location.href = '/login';
    }
  </script>
</body>
</html>
{{end}}
